<!-- Sidebar for authenticated users -->
<div class="w-64 bg-white border-r border-gray-200 h-full flex flex-col">
    <!-- Navigation Menu -->
    <nav class="p-4 flex-1">
        <a href="{% url 'gallery:dashboard' %}"
           class="w-full flex items-center gap-3 px-4 py-3 rounded-lg mb-2 transition-colors text-sm {% if request.resolver_match.url_name == 'dashboard' %}bg-secondary text-primary{% else %}text-foreground hover:bg-secondary/50{% endif %}">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span>Home</span>
        </a>
        
        <a href="{% url 'gallery:browse' %}"
           class="w-full flex items-center gap-3 px-4 py-3 rounded-lg mb-2 transition-colors text-sm {% if request.resolver_match.url_name == 'browse' %}bg-secondary text-primary{% else %}text-foreground hover:bg-secondary/50{% endif %}">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span>Browse</span>
        </a>
        
        <a href="{% url 'gallery:upload' %}"
           class="w-full flex items-center gap-3 px-4 py-3 rounded-lg mb-2 transition-colors text-sm {% if request.resolver_match.url_name == 'upload' %}bg-secondary text-primary{% else %}text-foreground hover:bg-secondary/50{% endif %}">
            <i data-lucide="upload" class="w-5 h-5"></i>
            <span>Upload Artwork</span>
        </a>
        
        <a href="{% url 'users:profile' %}"
           class="w-full flex items-center gap-3 px-4 py-3 rounded-lg mb-2 transition-colors text-sm {% if request.resolver_match.url_name == 'profile' %}bg-secondary text-primary{% else %}text-foreground hover:bg-secondary/50{% endif %}">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span>Profile</span>
        </a>

        <a href="{% url 'gamification:badges' %}"
           class="w-full flex items-center gap-3 px-4 py-3 rounded-lg mb-2 transition-colors text-sm {% if request.resolver_match.url_name == 'badges' %}bg-secondary text-primary{% else %}text-foreground hover:bg-secondary/50{% endif %}">
            <i data-lucide="award" class="w-5 h-5"></i>
            <span>Badges</span>
        </a>

        <!-- Admin section if user is admin -->
        {% if user.is_staff or user.is_superuser %}
        <div class="my-4 border-t border-gray-200"></div>
        <div class="text-xs text-gray-500 mb-2 pl-4">Admin</div>
        
        <a href="{% url 'moderation:dashboard' %}" 
           class="w-full flex items-center gap-3 px-4 py-3 rounded-lg mb-2 transition-colors text-sm {% if request.resolver_match.url_name == 'moderation_dashboard' %}bg-secondary text-primary{% else %}text-foreground hover:bg-secondary/50{% endif %}">
            <i data-lucide="shield" class="w-5 h-5"></i>
            <span>Moderation</span>
        </a>
            <i data-lucide="shield" class="w-5 h-5"></i>
            <span>Moderation</span>
        </a>
        {% endif %}
    </nav>

    <!-- Quick Stats Section -->
    <div class="p-4 border-t border-gray-200">
        <div class="text-xs text-muted-foreground mb-2">Quick Stats</div>
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-sm text-foreground">Artwork Created</span>
                <span class="text-sm font-semibold text-foreground">{{ profile.artwork_created }}</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-sm text-foreground">Total XP</span>
                <span class="text-sm font-semibold text-foreground">{{ profile.total_xp }}</span>
            </div>
        </div>
    </div>
</div>
